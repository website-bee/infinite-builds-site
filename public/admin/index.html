<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị — Infinite Builds Studio</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Infinite Builds <span>Admin</span></a>
    <nav>
      <a href="#/" data-nav="products">Sản phẩm</a>
      <a href="#/categories" data-nav="categories">Danh mục</a>
      <a href="/" target="_blank" rel="noopener">Xem website ↗</a>
    </nav>
    <a href="#" id="logout" class="right" style="color:var(--muted);text-decoration:none;font-size:14px">Đăng xuất</a>
  </header>
  <main id="app"><p class="muted pad">Đang tải…</p></main>
  <div id="toasts" aria-live="polite"></div>
  <script>
    document.getElementById('logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth', { method: 'DELETE', headers: { 'X-Admin-Request': '1' } });
      location.href = '/admin/login';
    });
  </script>
  <script src="/admin/admin.js"></script>
</body>
</html>
